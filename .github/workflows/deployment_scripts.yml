name: Deploy HOS based FORTEX (Vue/Vite)

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: npm install and build
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          if [ -z "$FRONTEND_ENV" ]; then
            echo "::error::FRONTEND_ENV GitHub Secret is not configured"
            exit 1
          fi
          printf '%s' "$FRONTEND_ENV" | base64 --decode > .env.production
          trap 'rm -f .env.production' EXIT
          npm install
          npm run build
          test -f dist/index.html
          ls -la dist

      - name: deploy to server
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass

          # 1) Prepare dist folder on server
          sshpass -p "${{ secrets.PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p /home/projects/hos_based_fortex/frontend/dist && rm -rf /home/projects/hos_based_fortex/frontend/dist/*"

          # 2) Upload new dist content
          sshpass -p "${{ secrets.PASSWORD }}" scp \
            -o StrictHostKeyChecking=no \
            -P ${{ secrets.SSH_PORT }} \
            -r dist/. \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/projects/hos_based_fortex/frontend/dist/

          # 3) Reload nginx
          sshpass -p "${{ secrets.PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "sudo nginx -t && sudo systemctl reload nginx"
